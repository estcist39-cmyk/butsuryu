<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病院 物流・医事管理 マニュアル検索Q&Aシステム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-tab { border-bottom: 3px solid #0d9488; color: #0f766e; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-teal-800 text-white shadow-md py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-hospital-user text-2xl text-teal-200"></i>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">病院 物流・医事管理 マニュアル検索Q&Aシステム</h1>
                    <p class="text-xs text-teal-200">高精度ルール抽出検索 ＆ スプレッドシート同期</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openGasModal()" class="text-xs bg-teal-900 hover:bg-teal-950 text-teal-100 border border-teal-600 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-plug text-amber-400"></i> シート連携設定
                </button>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="bg-white border-b border-slate-200 sticky top-16 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 flex space-x-8 overflow-x-auto">
            <button id="tab-qa-btn" onclick="switchTab('qa')" class="py-3 px-2 text-sm text-slate-600 active-tab transition flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-magnifying-glass text-teal-600"></i> マニュアル検索 ＆ シート同期
            </button>
            <button id="tab-logs-btn" onclick="switchTab('logs')" class="py-3 px-2 text-sm text-slate-600 transition flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-list-check"></i> 問い合わせログ (シート同期結果) <span id="log-count-badge" class="bg-teal-100 text-teal-800 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </button>
            <button id="tab-master-btn" onclick="switchTab('master')" class="py-3 px-2 text-sm text-slate-600 transition flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-table"></i> 全マスタ一覧（返戻・物流・マスタ）
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto w-full flex-1 p-4 md:p-6 flex flex-col gap-6">

        <!-- TAB 1: Q&A Engine -->
        <section id="sec-qa" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Input Form -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-magnifying-glass text-teal-600"></i> 質問・キーワード入力
                    </h2>
                    
                    <div class="bg-slate-50 border border-slate-200 p-3 rounded-lg flex items-center justify-between">
                        <div>
                            <span class="text-[10px] text-slate-500 font-semibold block uppercase">担当カテゴリ (自動判定)</span>
                            <span id="detected-agent
