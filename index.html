<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病院 物流・医事管理 Gemini 3.7 高精度Q&Aシステム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-tab { border-bottom: 3px solid #0d9488; color: #0f766e; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-teal-800 text-white shadow-md py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-hospital-user text-2xl text-teal-200"></i>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">病院 物流・医事管理 高精度Q&Aシステム</h1>
                    <p class="text-xs text-teal-200">Gemini 3.7 高度コンテキスト参照 ＆ スプレッドシート同期</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openApiKeyModal()" class="text-xs bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition shadow">
                    <i class="fa-solid fa-key"></i> Gemini APIキー設定
                </button>
                <button onclick="openGasModal()" class="text-xs bg-teal-900 hover:bg-teal-950 text-teal-100 border border-teal-600 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-plug text-amber-400"></i> シート連携設定
                </button>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="bg-white border-b border-slate-200 sticky top-16 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 flex space-x-8 overflow-x-auto">
            <button id="tab-qa-btn" onclick="switchTab('qa')" class="py-3 px-2 text-sm text-slate-600 active-tab transition flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-brain text-teal-600"></i> 高精度AI回答 ＆ シート同期
            </button>
            <button id="tab-logs-btn" onclick="switchTab('logs')" class="py-3 px-2 text-sm text-slate-600 transition flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-list-check"></i> 問い合わせログ (シート同期結果) <span id="log-count-badge" class="bg-teal-100 text-teal-800 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </button>
            <button id="tab-master-btn" onclick="switchTab('master')" class="py-3 px-2 text-sm text-slate-600 transition flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-table"></i> 全マスタ一覧（返戻・物流・マスタ）
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto w-full flex-1 p-4 md:p-6 flex flex-col gap-6">

        <!-- TAB 1: Q&A Engine -->
        <section id="sec-qa" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Input Form -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-magnifying-glass text-teal-600"></i> 質問・キーワード入力
                    </h2>
                    
                    <div class="bg-slate-50 border border-slate-200 p-3 rounded-lg flex items-center justify-between">
                        <div>
                            <span class="text-[10px] text-slate-500 font-semibold block uppercase">担当エージェント (自動判定)</span>
                            <span id="detected-agent" class="text-xs font-bold text-teal-700 flex items-center gap-1">
                                <i class="fa-solid fa-robot text-teal-600"></i> 入力内容から自動選定
                            </span>
                        </div>
                        <span class="text-[10px] bg-teal-100 text-teal-800 font-semibold px-2 py-0.5 rounded-full">AUTO</span>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">推論モデル</label>
                        <select id="model-select" class="w-full text-sm p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none font-medium text-teal-900">
                            <option value="gemini-3.7-flash">Gemini 3.7 Flash (最新・高速高精度・推奨)</option>
                            <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro (最新・高度分析)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">質問内容</label>
                        <textarea id="user-query" oninput="previewAgentSelection()" rows="4" class="w-full p-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none" placeholder="例: ブロンコ1を気管支動脈に使用して査定された時の対応は？&#10;例: 納品書とデータ入力の単位が違う時の対応は？"></textarea>
                    </div>

                    <button id="submit-btn" onclick="askGeminiAndSync()" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-semibold py-2.5 px-4 rounded-lg shadow transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-sparkles"></i> 高精度回答を生成＆シート反映
                    </button>
                </div>

                <!-- Short Cut Buttons -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">回答精度検証用サンプル事例</h3>
                    <div class="space-y-2">
                        <button onclick="setQuery('ブロンコ1を気管支動脈の塞栓術で使用して査定された場合の症状詳記の対応方法は？')" class="w-full text-left text-xs bg-slate-50 hover:bg-teal-50 hover:text-teal-800 p-2.5 rounded-lg border border-slate-200 transition">
                            <i class="fa-regular fa-circle-question text-teal-600 mr-1"></i> ブロンコ1/ブロンコ2の気管支動脈塞栓査定
                        </button>
                        <button onclick="setQuery('アビテンとフロシールを併用した時の請求対応は？')" class="w-full text-left text-xs bg-slate-50 hover:bg-teal-50 hover:text-teal-800 p-2.5 rounded-lg border border-slate-200 transition">
                            <i class="fa-regular fa-circle-question text-teal-600 mr-1"></i> アビテンとフロシールの併用請求
                        </button>
                        <button onclick="setQuery('バーコードを読み込んだ時に2つの物品が出てきてしまった時の対処法')" class="w-full text-left text-xs bg-slate-50 hover:bg-teal-50 hover:text-teal-800 p-2.5 rounded-lg border border-slate-200 transition">
                            <i class="fa-regular fa-circle-question text-teal-600 mr-1"></i> バーコード重複時の医事課連絡手順
                        </button>
                    </div>
                </div>
            </div>

            <!-- Answer Display -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col min-h-[380px]">
                    <div class="flex justify-between items-center border-b pb-3 mb-4">
                        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-brain text-teal-600"></i> 回答結果レポート
                        </h2>
                        <span id="status-tag" class="hidden text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-full flex items-center gap-1">
                            <i class="fa-solid fa-check-circle"></i> クラウドシート同期完了
                        </span>
                    </div>

                    <div id="answer-content" class="flex-1 text-slate-700 text-sm leading-relaxed space-y-3">
                        <div class="h-full flex flex-col items-center justify-center text-slate-400 py-12">
                            <i class="fa-solid fa-sparkles text-4xl mb-3 text-teal-400"></i>
                            <p>質問を入力すると、全マスタから最も関連性の高いルールを正確に抽出し回答を作成します。</p>
                        </div>
                    </div>
                </div>

                <!-- Reference Context Source -->
                <div class="bg-slate-100 p-4 rounded-xl border border-slate-200">
                    <h3 class="text-xs font-bold text-slate-600 mb-2 flex items-center gap-1">
                        <i class="fa-solid fa-link text-slate-500"></i> 回答根拠として抽出されたマニュアル箇所
                    </h3>
                    <div id="ref-context" class="text-xs font-mono bg-white p-3 rounded border border-slate-200 overflow-x-auto text-slate-600 max-h-40 whitespace-pre-wrap">
                        質問を実行すると参照されたマスタデータ行がここに抽出表示されます。
                    </div>
